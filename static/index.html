<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Coaching Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-950 text-white shadow py-3.5 px-6 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-graduation-cap text-amber-400 text-2xl"></i>
      <span class="font-bold text-lg tracking-tight">Apex Academy</span>
    </div>
    <div id="user-pill" class="hidden flex items-center space-x-3 text-sm">
      <span id="user-badge" class="px-2.5 py-0.5 rounded text-xs font-semibold bg-indigo-800 text-indigo-200"></span>
      <span id="user-name" class="font-medium text-slate-200"></span>
      <button onclick="logout()" class="text-xs text-rose-300 hover:text-rose-100 underline ml-2">Logout</button>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">

    <!-- 1. AUTH GATEWAY (Login & Registration) -->
    <div id="view-auth" class="bg-white p-8 rounded-xl shadow-lg border border-slate-200 w-full max-w-md">
      
      <!-- Toggle Header -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tab-btn-login" onclick="switchAuthMode('login')" class="w-1/2 pb-3 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition">
          Sign In
        </button>
        <button id="tab-btn-register" onclick="switchAuthMode('register')" class="w-1/2 pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition">
          Create Account
        </button>
      </div>

      <!-- Sign In Form -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Username / Roll No.</label>
          <input type="text" id="login-username" required class="w-full border border-slate-300 px-3 py-2 rounded text-sm focus:outline-indigo-600" placeholder="e.g. rahul or admin" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full border border-slate-300 px-3 py-2 rounded text-sm focus:outline-indigo-600" placeholder="••••••••" />
        </div>
        <p id="login-error" class="text-rose-600 text-xs hidden"></p>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
          Sign In
        </button>
      </form>

      <!-- Create Account Form -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
          <input type="text" id="reg-name" required class="w-full border border-slate-300 px-3 py-2 rounded text-sm focus:outline-indigo-600" placeholder="e.g. Rahul Sharma" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="reg-email" required class="w-full border border-slate-300 px-3 py-2 rounded text-sm focus:outline-indigo-600" placeholder="rahul@example.com" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Desired Username</label>
          <input type="text" id="reg-username" required class="w-full border border-slate-300 px-3 py-2 rounded text-sm focus:outline-indigo-600" placeholder="e.g. rahul2026" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="reg-password" required minlength="6" class="w-full border border-slate-300 px-3 py-2 rounded text-sm focus:outline-indigo-600" placeholder="Minimum 6 characters" />
        </div>
        <p id="register-error" class="text-rose-600 text-xs hidden"></p>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
          Create Account & Sign In
        </button>
      </form>

      <div class="mt-5 pt-4 border-t text-[11px] text-slate-400 text-center">
        Admin Portal auto-launches on verified admin credentials.
      </div>
    </div>

    <!-- 2. STUDENT LEARNING PORTAL -->
    <div id="view-student" class="hidden w-full max-w-5xl">
      <div class="flex border-b border-slate-300 bg-white rounded-t-lg px-4 pt-2 space-x-2">
        <button onclick="setStudentTab('classes')" id="tab-classes" class="py-2.5 px-4 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2">
          <i class="fa-solid fa-circle-play"></i> Video Classes
        </button>
        <button onclick="setStudentTab('quizzes')" id="tab-quizzes" class="py-2.5 px-4 font-semibold text-sm text-slate-500 hover:text-slate-700 border-b-2 border-transparent flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> Practice Quizzes
        </button>
        <button onclick="setStudentTab('pdfs')" id="tab-pdfs" class="py-2.5 px-4 font-semibold text-sm text-slate-500 hover:text-slate-700 border-b-2 border-transparent flex items-center gap-2">
          <i class="fa-solid fa-file-pdf"></i> PDF Notes & Material
        </button>
      </div>

      <div class="bg-white p-6 rounded-b-lg shadow-sm border border-t-0 border-slate-200 min-h-[450px]">
        <!-- Classes -->
        <div id="content-classes" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

        <!-- Quizzes -->
        <div id="content-quizzes" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4"></div>

        <!-- PDFs -->
        <div id="content-pdfs" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4"></div>

        <!-- Active Quiz Room -->
        <div id="active-quiz-room" class="hidden max-w-2xl mx-auto">
          <div class="flex justify-between items-center mb-4 pb-2 border-b">
            <h3 id="aq-title" class="font-bold text-lg text-slate-900"></h3>
            <span id="aq-timer" class="font-mono font-bold text-red-600 bg-red-50 px-2 py-1 rounded text-sm"></span>
          </div>
          <div id="aq-questions" class="space-y-4"></div>
          <button onclick="submitActiveQuiz()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded text-sm">Submit Exam</button>
        </div>

        <!-- Quiz Result Screen -->
        <div id="quiz-result-view" class="hidden text-center max-w-xl mx-auto py-8">
          <h2 class="text-2xl font-bold">Quiz Performance</h2>
          <div id="quiz-score" class="text-4xl font-extrabold text-indigo-600 my-3">0 / 0</div>
          <button onclick="setStudentTab('quizzes')" class="bg-slate-800 text-white px-5 py-2 rounded text-sm mt-4">Back to Quizzes</button>
        </div>
      </div>
    </div>

    <!-- 3. ADMIN MANAGEMENT CONTROL CENTER -->
    <div id="view-admin" class="hidden w-full max-w-5xl">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
          <div>
            <h2 class="text-xl font-bold text-slate-900">Administrator Control Center</h2>
            <p class="text-xs text-slate-500">Publish classes, manage quiz question sets, and upload notes.</p>
          </div>
          <span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded">Admin Authority</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

          <!-- Add Video Class -->
          <div class="border rounded-lg p-4 bg-slate-50">
            <h3 class="font-bold text-sm mb-3 flex items-center gap-2 text-indigo-900">
              <i class="fa-solid fa-video"></i> Add Video Class
            </h3>
            <form onsubmit="adminAddClass(event)" class="space-y-2 text-xs">
              <input id="ac-title" placeholder="Lecture Title" class="w-full border p-2 rounded" required />
              <input id="ac-sub" placeholder="Subject / Topic" class="w-full border p-2 rounded" required />
              <input id="ac-url" placeholder="Embed URL (e.g. YouTube Embed)" class="w-full border p-2 rounded" required />
              <input id="ac-dur" placeholder="Duration (e.g. 45 Mins)" class="w-full border p-2 rounded" required />
              <button class="w-full bg-indigo-600 text-white py-2 rounded font-semibold mt-2">Publish Class</button>
            </form>
            <div id="admin-classes-list" class="mt-4 space-y-2 max-h-40 overflow-y-auto"></div>
          </div>

          <!-- Add PDF Material -->
          <div class="border rounded-lg p-4 bg-slate-50">
            <h3 class="font-bold text-sm mb-3 flex items-center gap-2 text-indigo-900">
              <i class="fa-solid fa-file-pdf"></i> Upload PDF Note
            </h3>
            <form onsubmit="adminAddPDF(event)" class="space-y-2 text-xs">
              <input id="ap-title" placeholder="Document Title" class="w-full border p-2 rounded" required />
              <input id="ap-sub" placeholder="Subject" class="w-full border p-2 rounded" required />
              <input id="ap-url" placeholder="PDF Document Link URL" class="w-full border p-2 rounded" required />
              <input id="ap-pages" type="number" placeholder="Number of Pages" class="w-full border p-2 rounded" required />
              <button class="w-full bg-indigo-600 text-white py-2 rounded font-semibold mt-2">Publish PDF</button>
            </form>
            <div id="admin-pdfs-list" class="mt-4 space-y-2 max-h-40 overflow-y-auto"></div>
          </div>

          <!-- Add Practice Quiz -->
          <div class="border rounded-lg p-4 bg-slate-50">
            <h3 class="font-bold text-sm mb-3 flex items-center gap-2 text-indigo-900">
              <i class="fa-solid fa-clipboard-question"></i> Create Quiz
            </h3>
            <form onsubmit="adminAddQuiz(event)" class="space-y-2 text-xs">
              <input id="aq-t" placeholder="Quiz Title" class="w-full border p-2 rounded" required />
              <input id="aq-s" placeholder="Subject" class="w-full border p-2 rounded" required />
              <input id="aq-d" type="number" placeholder="Duration in Mins" class="w-full border p-2 rounded" required />

              <div class="border-t pt-2 mt-2">
                <p class="font-bold text-[10px] text-slate-500 uppercase">Single Question Quick Add</p>
                <input id="aq-qt" placeholder="Question Text" class="w-full border p-1 rounded mt-1" required />
                <input id="aq-o0" placeholder="Option 1" class="w-full border p-1 rounded mt-1" required />
                <input id="aq-o1" placeholder="Option 2" class="w-full border p-1 rounded mt-1" required />
                <select id="aq-co" class="w-full border p-1 rounded mt-1">
                  <option value="0">Option 1 is correct</option>
                  <option value="1">Option 2 is correct</option>
                </select>
              </div>

              <button class="w-full bg-indigo-600 text-white py-2 rounded font-semibold mt-2">Save & Publish Quiz</button>
            </form>
          </div>

        </div>
      </div>
    </div>

  </main>

  <script>
    let authUser = null;
    let currentQuizData = null;
    let quizTimer = null;

    // --- TOGGLE AUTH VIEW ---
    function switchAuthMode(mode) {
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('register-error').classList.add('hidden');

      if (mode === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('tab-btn-login').className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition';
        document.getElementById('tab-btn-register').className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition';
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.remove('hidden');
        document.getElementById('tab-btn-register').className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 border-emerald-600 text-emerald-600 transition';
        document.getElementById('tab-btn-login').className = 'w-1/2 pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition';
      }
    }

    // --- CREATE ACCOUNT HANDLER ---
    async function handleRegister(e) {
      e.preventDefault();
      const err = document.getElementById('register-error');
      err.classList.add('hidden');

      const payload = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        username: document.getElementById('reg-username').value,
        password: document.getElementById('reg-password').value
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');

        // Automatically log in newly created user
        setupSession(data);
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    // --- SIGN IN HANDLER ---
    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      const err = document.getElementById('login-error');
      err.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Invalid login credentials');
        
        setupSession(data);
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    function setupSession(data) {
      authUser = data;
      document.getElementById('view-auth').classList.add('hidden');
      document.getElementById('user-pill').classList.remove('hidden');
      document.getElementById('user-name').innerText = data.name;
      document.getElementById('user-badge').innerText = data.role.toUpperCase();

      // Automatic role-based routing
      if (data.role === 'admin') {
        document.getElementById('view-admin').classList.remove('hidden');
        loadAdminLists();
      } else {
        document.getElementById('view-student').classList.remove('hidden');
        setStudentTab('classes');
      }
    }

    function logout() {
      authUser = null;
      document.getElementById('user-pill').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      document.getElementById('view-student').classList.add('hidden');
      document.getElementById('view-auth').classList.remove('hidden');
      switchAuthMode('login');
    }

    // --- STUDENT VIEW LOGIC ---
    function setStudentTab(tab) {
      ['classes', 'quizzes', 'pdfs'].forEach(t => {
        document.getElementById(`content-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'py-2.5 px-4 font-semibold text-sm text-slate-500 hover:text-slate-700 border-b-2 border-transparent flex items-center gap-2';
      });
      document.getElementById('active-quiz-room').classList.add('hidden');
      document.getElementById('quiz-result-view').classList.add('hidden');

      document.getElementById(`content-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-2.5 px-4 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2';

      if (tab === 'classes') loadClasses();
      if (tab === 'quizzes') loadQuizzes();
      if (tab === 'pdfs') loadPDFs();
    }

    async function loadClasses() {
      const res = await fetch('/api/classes');
      const data = await res.json();
      const wrap = document.getElementById('content-classes');
      wrap.innerHTML = data.classes.map(c => `
        <div class="border rounded-lg overflow-hidden bg-slate-50 shadow-sm">
          <div class="aspect-video">
            <iframe src="${c.video_url}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
          </div>
          <div class="p-3">
            <span class="text-[10px] font-bold px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded">${c.subject}</span>
            <h4 class="font-bold text-sm mt-1 text-slate-800">${c.title}</h4>
            <span class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${c.duration}</span>
          </div>
        </div>
      `).join('');
    }

    async function loadPDFs() {
      const res = await fetch('/api/pdfs');
      const data = await res.json();
      const wrap = document.getElementById('content-pdfs');
      wrap.innerHTML = data.pdfs.map(p => `
        <div class="p-4 border rounded-lg bg-slate-50 flex flex-col justify-between">
          <div>
            <i class="fa-solid fa-file-pdf text-rose-500 text-2xl mb-2"></i>
            <span class="text-[10px] block font-bold text-slate-400 uppercase">${p.subject}</span>
            <h4 class="font-bold text-sm text-slate-900">${p.title}</h4>
            <p class="text-xs text-slate-500 mt-1">${p.pages} Pages</p>
          </div>
          <a href="${p.file_url}" target="_blank" class="mt-4 bg-slate-800 hover:bg-slate-900 text-white text-center py-2 rounded text-xs font-semibold">
            Open PDF
          </a>
        </div>
      `).join('');
    }

    async function loadQuizzes() {
      const res = await fetch('/api/quizzes');
      const data = await res.json();
      const wrap = document.getElementById('content-quizzes');
      wrap.innerHTML = data.quizzes.map(q => `
        <div class="p-4 border rounded-lg bg-slate-50 flex flex-col justify-between">
          <div>
            <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${q.subject}</span>
            <h4 class="font-bold text-sm text-slate-900 mt-1">${q.title}</h4>
            <p class="text-xs text-slate-500 mt-1">${q.total_questions} Questions • ${q.duration_minutes} Mins</p>
          </div>
          <button onclick="startQuiz('${q.id}')" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-xs font-semibold">
            Take Quiz
          </button>
        </div>
      `).join('');
    }

    async function startQuiz(qid) {
      const res = await fetch(`/api/quizzes/${qid}`);
      currentQuizData = await res.json();
      
      document.getElementById('content-quizzes').classList.add('hidden');
      document.getElementById('active-quiz-room').classList.remove('hidden');
      document.getElementById('aq-title').innerText = currentQuizData.title;

      const qBox = document.getElementById('aq-questions');
      qBox.innerHTML = currentQuizData.questions.map((q, idx) => `
        <div class="border p-3 rounded bg-slate-50 text-sm">
          <p class="font-medium mb-2">${idx + 1}. ${q.text}</p>
          <div class="space-y-1">
            ${q.options.map((opt, oIdx) => `
              <label class="flex items-center space-x-2 text-xs cursor-pointer">
                <input type="radio" name="aq-${q.id}" value="${oIdx}">
                <span>${opt}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');

      let remain = currentQuizData.duration_minutes * 60;
      clearInterval(quizTimer);
      quizTimer = setInterval(() => {
        remain--;
        const m = Math.floor(remain / 60);
        const s = remain % 60;
        document.getElementById('aq-timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        if (remain <= 0) {
          clearInterval(quizTimer);
          submitActiveQuiz();
        }
      }, 1000);
    }

    async function submitActiveQuiz() {
      clearInterval(quizTimer);
      const answers = {};
      currentQuizData.questions.forEach(q => {
        const checked = document.querySelector(`input[name="aq-${q.id}"]:checked`);
        if (checked) answers[q.id] = parseInt(checked.value);
      });

      const res = await fetch('/api/quizzes/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quiz_id: currentQuizData.id, answers })
      });
      const data = await res.json();

      document.getElementById('active-quiz-room').classList.add('hidden');
      document.getElementById('quiz-result-view').classList.remove('hidden');
      document.getElementById('quiz-score').innerText = `${data.score} / ${data.total} (${data.percentage}%)`;
    }

    // --- ADMIN METHODS ---
    async function loadAdminLists() {
      const [cRes, pRes] = await Promise.all([fetch('/api/classes'), fetch('/api/pdfs')]);
      const cData = await cRes.json();
      const pData = await pRes.json();

      document.getElementById('admin-classes-list').innerHTML = cData.classes.map(c => `
        <div class="flex justify-between items-center text-[11px] bg-white p-1.5 border rounded">
          <span class="truncate w-3/4">${c.title}</span>
          <button onclick="adminDelete('classes', '${c.id}')" class="text-rose-600">Delete</button>
        </div>
      `).join('');

      document.getElementById('admin-pdfs-list').innerHTML = pData.pdfs.map(p => `
        <div class="flex justify-between items-center text-[11px] bg-white p-1.5 border rounded">
          <span class="truncate w-3/4">${p.title}</span>
          <button onclick="adminDelete('pdfs', '${p.id}')" class="text-rose-600">Delete</button>
        </div>
      `).join('');
    }

    async function adminDelete(type, id) {
      await fetch(`/api/admin/${type}/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${authUser.token}` }
      });
      loadAdminLists();
    }

    async function adminAddClass(e) {
      e.preventDefault();
      await fetch('/api/admin/classes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authUser.token}` },
        body: JSON.stringify({
          title: document.getElementById('ac-title').value,
          subject: document.getElementById('ac-sub').value,
          video_url: document.getElementById('ac-url').value,
          duration: document.getElementById('ac-dur').value
        })
      });
      document.getElementById('ac-title').value = '';
      document.getElementById('ac-sub').value = '';
      document.getElementById('ac-url').value = '';
      document.getElementById('ac-dur').value = '';
      loadAdminLists();
    }

    async function adminAddPDF(e) {
      e.preventDefault();
      await fetch('/api/admin/pdfs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authUser.token}` },
        body: JSON.stringify({
          title: document.getElementById('ap-title').value,
          subject: document.getElementById('ap-sub').value,
          file_url: document.getElementById('ap-url').value,
          pages: parseInt(document.getElementById('ap-pages').value)
        })
      });
      document.getElementById('ap-title').value = '';
      document.getElementById('ap-sub').value = '';
      document.getElementById('ap-url').value = '';
      document.getElementById('ap-pages').value = '';
      loadAdminLists();
    }

    async function adminAddQuiz(e) {
      e.preventDefault();
      const q = {
        title: document.getElementById('aq-t').value,
        subject: document.getElementById('aq-s').value,
        duration_minutes: parseInt(document.getElementById('aq-d').value),
        questions: [{
          text: document.getElementById('aq-qt').value,
          options: [document.getElementById('aq-o0').value, document.getElementById('aq-o1').value],
          correct_option: parseInt(document.getElementById('aq-co').value)
        }]
      };
      await fetch('/api/admin/quizzes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authUser.token}` },
